name: ledgerhand

# ---------------------------------------------------------------------------
# Two databases on purpose.
#
#   postgres       the one you develop against, on 5432, with your seed data
#   postgres-test  a throwaway on 5433 that the integration and row level
#                  security tests reset at will
#
# Keeping them apart means running the test suite never eats the demo data you
# were about to record a GIF of.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:17-alpine
    container_name: ledgerhand-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledgerhand
      # Business dates are derived in the tenant timezone by the application;
      # the server itself stays on UTC so nothing is ambiguous on the wire.
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ledgerhand']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    container_name: ledgerhand-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledgerhand_test
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5433:5432'
    # No volume: the test database is meant to be disposable, and starting from
    # empty is faster than cleaning up after a failed run.
    tmpfs:
      - /var/lib/postgresql/data
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ledgerhand_test']
      interval: 3s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # The application itself, for someone who wants to see it rather than work
  # on it:
  #
  #     docker compose -f docker/compose.yml --profile demo up
  #
  # Then open http://localhost:3000 and sign in with admin@ledgerhand.dev.
  # Development still runs the app from source against the postgres service
  # above; the demo profile keeps the two out of each other’s way.
  # -------------------------------------------------------------------------
  migrate:
    profiles: ['demo']
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      target: tools
    container_name: ledgerhand-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/ledgerhand
      DATABASE_URL: postgres://ledgerhand_app:ledgerhand_app@postgres:5432/ledgerhand
      SEED_PASSWORD: ${SEED_PASSWORD:-ledgerhand}
    # Migrating creates the application role and the policies; seeding fills
    # ninety days of trading by calling the real use cases. Seeding a database
    # that already has tenants declines politely, so restarting is safe.
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    restart: 'no'

  web:
    profiles: ['demo']
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      target: runner
    container_name: ledgerhand-web
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://ledgerhand_app:ledgerhand_app@postgres:5432/ledgerhand
      DATABASE_AUTH_URL: postgres://ledgerhand_auth:ledgerhand_auth@postgres:5432/ledgerhand
      # Overridable, and deliberately not a secret worth protecting: this
      # compose file is a demonstration, not a deployment.
      AUTH_SECRET: ${AUTH_SECRET:-a-demo-secret-that-is-long-enough-to-be-valid}
      AUTH_URL: http://localhost:${WEB_PORT:-3000}
      AUTH_TRUST_HOST: 'true'
    ports:
      - '${WEB_PORT:-3000}:3000'
    restart: unless-stopped

volumes:
  postgres-data:
