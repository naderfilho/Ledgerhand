name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The integration tests need a real Postgres. In CI it is always there, so
  # nothing is skipped where it matters.
  DATABASE_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5433/ledgerhand_test
  DATABASE_TEST_URL: postgres://ledgerhand_app:ledgerhand_app@localhost:5433/ledgerhand_test

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerhand_test
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerhand_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the LTS the project supports, even though the code also
          # runs on 24: a green build here means "works on the version we
          # claim", not "works on whatever the runner had today".
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Before the type-aware lint and the type-check, not after: they read
      # the declaration files the workspace packages emit, and a clean
      # checkout has none.
      - name: Build
        run: pnpm build

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  evals:
    name: Evals
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The suite calls a real model, so it needs a real key. Pull requests from
    # forks do not get one, and that is fine: the job says so and stops rather
    # than failing for a reason a contributor cannot fix.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENT_MODEL: claude-sonnet-5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: No key configured
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "ANTHROPIC_API_KEY is not set, so the eval suite did not run." >> "$GITHUB_STEP_SUMMARY"

      # k=1 in CI: enough to catch a guardrail that broke, cheap enough to run
      # on every push. The rate quoted in the README is measured at k=3.
      - name: Run the scenarios
        if: env.ANTHROPIC_API_KEY != ''
        run: pnpm evals --k 1 --markdown evals.md --json evals.json --quiet

      - name: Report
        if: always() && env.ANTHROPIC_API_KEY != ''
        run: cat evals.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the transcripts
        if: always() && env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: evals
          path: |
            evals.md
            evals.json
          retention-days: 14
          if-no-files-found: ignore

  demo-image:
    name: Demo image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The quickstart is the first thing anyone runs. If it stops building, the
    # repository is broken for a reader before it is broken for a developer.

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image the quickstart uses
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
