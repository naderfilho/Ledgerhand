name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The integration tests need a real Postgres. In CI it is always there, so
  # nothing is skipped where it matters.
  DATABASE_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5433/ledgerhand_test
  DATABASE_TEST_URL: postgres://ledgerhand_app:ledgerhand_app@localhost:5433/ledgerhand_test

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerhand_test
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerhand_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the LTS the project supports, even though the code also
          # runs on 24: a green build here means "works on the version we
          # claim", not "works on whatever the runner had today".
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
